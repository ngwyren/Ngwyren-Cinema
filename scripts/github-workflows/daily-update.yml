name: Scheduled Movie Update, Deduplication & Web Maintenance

on:
  schedule:
    # Tự động chạy định kỳ 2 lần/ngày: 00:00 nửa đêm và 12:00 trưa giờ Việt Nam (17:00 & 05:00 UTC)
    - cron: '0 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js for JS Syntax Verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crawl New Movies, Deduplicate Best Quality & Repair Schedule
        run: |
          python3 scripts/maintain_and_update.py

      - name: Verify JavaScript Syntax Integrity
        run: |
          node --check js/movies-catalog.js
          node --check js/air-schedule.js
          node --check js/data.js
          node --check js/app.js

      - name: Commit and Push Updated Catalog & Schedule
        run: |
          git config --global user.name "Ngwyren Cinema Maintenance Bot"
          git config --global user.email "bot@ngwyren.cinema"
          git add js/movies-catalog.js js/air-schedule.js
          if git diff --staged --quiet; then
            echo "Kho phim và lịch chiếu đã ở trạng thái tối ưu nhất, không có thay đổi."
          else
            git commit -m "chore(auto-update): cập nhật phim mới, khử trùng lặp bản chất lượng cao nhất & bảo trì định kỳ [skip ci]"
            git push origin main
          fi
