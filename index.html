<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ngwyren Cinema</title>
  <meta name="description" content="Ngwyren Cinema — Spatial Glass Streaming" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect width='64' height='64' rx='16' fill='%23000000'/%3E%3Crect x='2' y='2' width='60' height='60' rx='14' stroke='%23FFFFFF' stroke-opacity='0.4' stroke-width='2.5'/%3E%3Cpath d='M25 19.5C25 18.3 26.34 17.58 27.34 18.25L46.09 30.75C46.98 31.34 46.98 32.66 46.09 33.25L27.34 45.75C26.34 46.42 25 45.7 25 44.5V19.5Z' fill='%23FFFFFF'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- HLS.js for playing .m3u8 streams -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Google Identity Services (GIS) for Real Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=3.9" />
</head>
<body>

  <!-- Spatial Environment Backdrop (Static Zero-Lag Soft Room Lighting) -->
  <div class="spatial-room-bg" aria-hidden="true"></div>

  <!-- Toast Notifications -->
  <div class="apple-toast-container" id="toastContainer"></div>

  <!-- ========================================================================
       VISION PRO SPATIAL STAGE (LEFT FLOATING ICON PILL + MAIN GLASS WINDOW)
       ======================================================================== -->
  <div class="vision-stage">

    <!-- FLOATING LEFT VERTICAL ICON PILL DOCK (LIKE VISION OS) -->
    <aside class="vision-left-dock" id="appleSidebar" aria-label="Thanh điều hướng nhanh" style="--dock-idx: 0;">
      <span class="vision-dock-indicator" id="visionDockIndicator" aria-hidden="true"></span>
      <button class="vision-dock-icon active" data-nav="kham-pha" data-dock-idx="0" data-label="Khám Phá" onclick="app.resetAllFilters()" title="Trang chủ Khám Phá">
        <i class="fas fa-house"></i>
      </button>
      <button class="vision-dock-icon" data-nav="yeu-thich" data-dock-idx="1" data-label="Đã Lưu" onclick="app.setNavigation('yeu-thich')" title="Danh sách Đã Lưu">
        <i class="fas fa-heart"></i>
      </button>
      <button class="vision-dock-icon" data-nav="lich-su" data-dock-idx="2" data-label="Lịch Sử" onclick="app.setNavigation('lich-su')" title="Lịch Sử Xem Tiếp">
        <i class="fas fa-download"></i>
      </button>
      <button class="vision-dock-icon" data-nav="anime" data-dock-idx="3" data-label="Anime" onclick="app.setNavigation('anime')" title="Kho Phim Anime">
        <i class="fas fa-wand-magic-sparkles"></i>
      </button>
      <button class="vision-dock-icon" data-nav="cai-dat" data-dock-idx="4" data-label="Cài Đặt" onclick="app.setNavigation('cai-dat')" title="Cài Đặt Hệ Thống">
        <i class="fas fa-gear"></i>
      </button>
    </aside>

    <!-- MAIN SPATIAL GLASS WINDOW -->
    <div class="vision-window">

      <!-- TOP SPATIAL NAVIGATION BAR -->
      <header class="vision-topbar">
        <!-- Left Search Pill -->
        <div class="topbar-search-container">
          <div class="vision-search-pill">
            <i class="fas fa-magnifying-glass"></i>
            <input
              type="text"
              id="topSearchInput"
              placeholder="Tìm kiếm phim, anime, diễn viên..."
              autocomplete="off"
            />
            <button class="search-clear-btn" id="searchClearBtn" onclick="app.clearSearch()" title="Xóa tìm kiếm">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <!-- Instant Search Results Glass Dropdown -->
          <div class="search-dropdown" id="searchDropdown"></div>
        </div>

        <!-- Center Category Pills (Khám Phá | Phim Lẻ | Phim Bộ | Hoạt Hình | Netflix | Vietsub | Thêm) -->
        <nav class="vision-nav-pills" aria-label="Danh mục chính">
          <button class="vision-nav-pill active" data-nav="kham-pha" onclick="app.resetAllFilters()">Khám Phá</button>
          <button class="vision-nav-pill" data-nav="phim-le" onclick="app.setNavigation('phim-le')">Phim Lẻ</button>
          <button class="vision-nav-pill" data-nav="phim-bo" onclick="app.setNavigation('phim-bo')">Phim Bộ</button>
          <button class="vision-nav-pill" data-nav="anime" onclick="app.setNavigation('anime')">Hoạt Hình</button>
          <button class="vision-nav-pill" data-nav="netflix" onclick="app.setNavigation('netflix')">Netflix</button>
          <button class="vision-nav-pill" data-nav="vietsub" onclick="app.setNavigation('vietsub')">Vietsub</button>
          <button class="vision-nav-pill" data-nav="moi-cap-nhat" onclick="app.setNavigation('moi-cap-nhat')">
            Thêm <span class="vision-count-tag" id="totalMoviesCountBadge">1739</span>
          </button>
        </nav>

        <!-- Right Notification & User Profile Pill -->
        <div class="vision-topbar-right">
          <button class="vision-circle-btn" onclick="app.setNavigation('yeu-thich')" title="Phim đã lưu">
            <i class="fas fa-bell"></i>
            <span class="vision-notif-dot"></span>
          </button>
          <div class="vision-profile-pill" id="topProfilePill" onclick="app.openAuthModal()" title="Hồ sơ & Đăng nhập">
            <div class="vision-avatar" id="topProfileAvatar">
              <div class="profile-avatar-letter" style="background: rgba(255, 255, 255, 0.16); color: #ffffff;">G</div>
            </div>
            <div class="vision-profile-text">
              <span class="vision-profile-name" id="topProfileName">Guest</span>
              <span class="vision-profile-handle" id="topProfileHandle" style="display:none;"></span>
            </div>
            <i class="fas fa-chevron-down vision-profile-arrow"></i>
          </div>
        </div>
      </header>

      <!-- DYNAMIC MAIN CONTENT (2-COLUMN VISION OS DASHBOARD OR CATEGORY GRID) -->
      <main class="vision-content-area" id="mainContentWrapper">
        <!-- Rendered instantly by js/app.js -->
      </main>

    </div>
  </div>

  <!-- ========================================================================
       FLOATING MINI-PLAYER BAR (COMPACT VISION OS PILL)
       ======================================================================== -->
  <footer class="apple-player-bar" id="applePlayerBar">
    <div class="player-now-info" onclick="app.openMovieModal(app.playingMovie?.slug || 'thanh-guom-diet-quy-vo-han-thanh-465645', false)">
      <div class="player-now-art">
        <img id="nowPlayingArt" src="https://phimimg.com/upload/vod/20250722-1/66ee196318069c6ede9450a5f76a4648.jpg" alt="Now Playing" />
      </div>
      <div class="player-now-text">
        <div class="player-now-title">
          <div class="eq-bars paused" id="nowPlayingEq">
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
            <span class="eq-bar"></span>
          </div>
          <span id="nowPlayingTitleText">Thanh Gươm Diệt Quỷ: Vô Hạn Thành</span>
        </div>
        <div class="player-now-sub" id="nowPlayingSubText">Bản Điện Ảnh Full • FHD Vietsub</div>
      </div>
    </div>

    <div class="player-transport">
      <div class="transport-btns">
        <button class="transport-btn" onclick="app.stepNowPlayingEpisode(-1)" title="Tập trước / Phim liên quan">
          <i class="fas fa-backward-step" style="font-size: 1rem;"></i>
        </button>
        <button class="transport-play-main" onclick="app.toggleNowPlayingPlayPause()" title="Phát / Tạm dừng">
          <i class="fas fa-play" id="nowPlayingPlayIcon" style="font-size: 0.9rem;"></i>
        </button>
        <button class="transport-btn" onclick="app.stepNowPlayingEpisode(1)" title="Tập tiếp theo / Phim liên quan">
          <i class="fas fa-forward-step" style="font-size: 1rem;"></i>
        </button>
      </div>

      <div class="transport-scrubber">
        <span id="nowPlayingCurrentTime">00:00</span>
        <div class="scrubber-track" onclick="app.openMovieModal(app.playingMovie?.slug, true, app.currentEpisodeIndex)">
          <div class="scrubber-fill" id="nowPlayingScrubberFill"></div>
        </div>
        <span id="nowPlayingTotalTime">FHD</span>
      </div>
    </div>

    <div class="player-extra-controls">
      <button class="icon-btn" style="width: 34px; height: 34px;"
              onclick="app.toggleMyList(app.playingMovie?.slug, event)"
              title="Lưu vào Danh sách của tôi">
        <i class="fas fa-plus"></i>
      </button>
      <button class="btn-expand-cinema" onclick="app.openMovieModal(app.playingMovie?.slug, true, app.currentEpisodeIndex)">
        <i class="fas fa-expand"></i> Mở Rạp Phim
      </button>
    </div>
  </footer>

  <!-- ========================================================================
       MOBILE & TABLET FLOATING BOTTOM DOCK
       ======================================================================== -->
  <nav class="liquid-mobile-dock" id="liquidMobileDock" aria-label="Điều hướng nhanh">
    <button class="dock-tab-btn active" data-nav="kham-pha" onclick="app.resetAllFilters()">
      <i class="fas fa-house"></i>
      <span>Khám Phá</span>
    </button>
    <button class="dock-tab-btn" data-nav="phim-le" onclick="app.setNavigation('phim-le')">
      <i class="fas fa-film"></i>
      <span>Movies</span>
    </button>
    <button class="dock-tab-btn" data-nav="anime" onclick="app.setNavigation('anime')">
      <i class="fas fa-wand-magic-sparkles"></i>
      <span>Anime</span>
    </button>
    <button class="dock-tab-btn" data-nav="netflix" onclick="app.setNavigation('netflix')">
      <i class="fas fa-circle-play"></i>
      <span>Netflix</span>
    </button>
    <button class="dock-tab-btn" data-nav="yeu-thich" onclick="app.setNavigation('yeu-thich')">
      <i class="fas fa-heart"></i>
      <span>Đã Lưu</span>
    </button>
  </nav>

  <!-- ========================================================================
       USER PROFILE & AUTH MODAL (GOOGLE LOGIN + GUEST CUSTOMIZATION)
       ======================================================================== -->
  <div class="detail-modal-backdrop auth-modal-backdrop" id="authModal" onclick="if(event.target === this) app.closeAuthModal()">
    <div class="detail-modal-sheet auth-modal-sheet" id="authSheet">
      <!-- Populated dynamically by js/app.js -->
    </div>
  </div>

  <!-- ========================================================================
       MOVIE DETAIL & HLS PLAYER MODAL
       ======================================================================== -->
  <div class="detail-modal-backdrop" id="movieDetailModal" onclick="if(event.target === this) app.closeMovieModal()">
    <div class="detail-modal-sheet" id="movieDetailSheet">
      <!-- Populated dynamically by js/app.js -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/movies-catalog.js?v=3.9"></script>
  <script src="js/data.js?v=3.9"></script>
  <script src="js/auth-config.js?v=3.9"></script>
  <script src="js/app.js?v=3.9"></script>
</body>
</html>
